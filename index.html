let currentChapterId = "";
let now = 0, life = 3, combo = 0, score = 0, questions = [];

//随机抽题
function shuffle(arr){
  const newArr = [...arr];
  for(let i=newArr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [newArr[i],newArr[j]] = [newArr[j],newArr[i]];
  }
  return newArr;
}

//渲染章节列表
function renderChapters(){
  const listWrap = document.getElementById("chapterList");
  listWrap.innerHTML = "";
  chapterData.forEach(ch=>{
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `<div class="img-area">${ch.icon}</div><h3>${ch.name}</h3><p>题库${questionBank[ch.id].length}题，每次随机15题</p>`;
    div.onclick = ()=>startQuiz(ch.id);
    listWrap.appendChild(div);
  });
}

//开始刷题
function startQuiz(chapterId){
  currentChapterId = chapterId;
  //从题库随机抽15题
  questions = shuffle(questionBank[chapterId]).slice(0, 15);
  now = 0; life = 3; combo = 0; score = 0;
  renderQuestion();
  switchPage("pageQuiz");
}

function renderQuestion(){
  const item = questions[now];
  document.getElementById("qIndex").innerText = now+1;
  document.getElementById("life").innerText = "❤️".repeat(life);
  document.getElementById("combo").innerText = combo;
  document.getElementById("scoreShow").innerText = score;
  document.getElementById("question").innerText = item.q;
  const optWrap = document.getElementById("optionsWrap");
  optWrap.innerHTML = "";
  item.opt.forEach(opt=>{
    const div = document.createElement("div");
    div.className = "option";
    div.innerText = opt;
    div.onclick = ()=>selectAnswer(opt[0], div, item.ans);
    optWrap.appendChild(div);
  });
}

function selectAnswer(sel, el, correctAns){
  //显示对错
  const allOpt = document.querySelectorAll(".option");
  allOpt.forEach(o=>{
    if(o.innerText[0] === correctAns) o.classList.add("correct");
    if(o === el && sel !== correctAns) o.classList.add("wrong");
    o.style.pointerEvents = "none";
  });

  setTimeout(()=>{
    if(sel === correctAns){
      combo++; score += 10*combo;
    }else{
      life--; combo=0;
      if(life <=0){ endGame(); return; }
    }
    now++;
    if(now >=15){ endGame(); return; }
    renderQuestion();
  }, 800);
}

function endGame(){
  switchPage("pageResult");
  let tip = "";
  if(score >= 120) tip="🌟地理小能手！本小节知识点掌握扎实";
  else if(score >= 90) tip="📖掌握不错，个别知识点需要复盘";
  else if(score >= 60) tip="💡基础熟悉，重点巩固易错题";
  else tip="🌱继续加油，梳理课本概念";
  document.getElementById("resultText").innerText=`总分：${score}分\n${tip}`;
}

function retryChapter(){
  startQuiz(currentChapterId);
}

function backHome(){
  switchPage("pageHome");
}

//页面切换工具
function switchPage(pageId){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(pageId).classList.add("active");
}

//初始化
renderChapters();
</script>
